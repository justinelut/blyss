name: Server Inventory (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory server and all Kubernetes namespaces
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo '=== SERVER ==='
            hostname
            date -u
            uptime
            free -h
            df -hT / /opt /srv /var/www /var/lib/rancher/k3s 2>/dev/null || true

            echo '=== RUNNING SYSTEM SERVICES ==='
            sudo systemctl list-units --type=service --state=running --no-legend --plain || true

            echo '=== PROJECT DIRECTORIES AND COMPOSE FILES ==='
            for path in /opt /srv /var/www /home/ubuntu; do
              if [ -d "$path" ]; then
                echo "--- $path ---"
                sudo find "$path" -mindepth 1 -maxdepth 3 -type d ! -path '*/.*' -print 2>/dev/null | sort
                sudo find "$path" -maxdepth 5 \( -type d -name .git -o -type f \( -iname 'docker-compose.yml' -o -iname 'docker-compose.yaml' -o -iname 'compose.yml' -o -iname 'compose.yaml' \) \) -print 2>/dev/null | sort
              fi
            done

            echo '=== DOCKER CONTAINERS (if Docker is installed) ==='
            if command -v docker >/dev/null 2>&1; then
              sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
            else
              echo 'Docker is not installed'
            fi

            echo '=== KUBERNETES NODES ==='
            sudo kubectl get nodes -o wide

            echo '=== KUBERNETES NAMESPACES ==='
            sudo kubectl get namespaces --show-labels

            echo '=== PODS IN ALL NAMESPACES ==='
            sudo kubectl get pods --all-namespaces -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.containerStatuses[*].ready,PHASE:.status.phase,RESTARTS:.status.containerStatuses[*].restartCount,NODE:.spec.nodeName,IMAGES:.spec.containers[*].image' --sort-by=.metadata.namespace

            echo '=== WORKLOADS IN ALL NAMESPACES ==='
            sudo kubectl get deployments,statefulsets,daemonsets,jobs,cronjobs --all-namespaces -o wide

            echo '=== SERVICES AND STANDARD INGRESS ==='
            sudo kubectl get services,ingresses --all-namespaces -o wide

            echo '=== STORAGE ==='
            sudo kubectl get persistentvolumeclaims --all-namespaces -o wide
            sudo kubectl get persistentvolumes -o wide

            echo '=== NETWORK AND RESOURCE POLICIES ==='
            sudo kubectl get networkpolicies,resourcequotas,limitranges --all-namespaces -o wide

            echo '=== TRAEFIK ROUTES (when installed) ==='
            sudo kubectl get ingressroutes,middlewares --all-namespaces -o wide 2>/dev/null || echo 'Traefik route resources unavailable'

            echo '=== LIVE NODE RESOURCE USAGE ==='
            sudo kubectl top nodes 2>&1 || echo 'Node metrics unavailable'
            sudo kubectl top pods --all-namespaces --containers 2>&1 || echo 'Pod metrics unavailable'
