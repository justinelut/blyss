name: Test MinIO Connectivity

on:
  workflow_dispatch: # Manual trigger only

jobs:
  test-connectivity:
    name: Test MinIO Connectivity and Diagnose Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/test-connectivity.sh"
          target: "/tmp/blyss-minio/"
          strip_components: 3

      - name: Run Connectivity Tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🔍 Running MinIO connectivity tests..."

            cd /tmp/blyss-minio
            chmod +x test-connectivity.sh

            # Run the test script
            sudo bash test-connectivity.sh

            echo "✅ Tests completed!"
