name: Configure MinIO

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
    paths:
      - 'oracle/redis-minio/**'
      - '.github/workflows/configure-minio.yml'

jobs:
  configure-minio:
    name: Configure MinIO CORS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/configure-cors.sh"
          target: "/tmp/blyss-minio/"
          strip_components: 3

      - name: Configure MinIO CORS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Configuring MinIO CORS..."

            cd /tmp/blyss-minio
            chmod +x configure-cors.sh

            # Run the configuration script
            sudo bash configure-cors.sh

            echo "✅ MinIO CORS configuration completed!"
