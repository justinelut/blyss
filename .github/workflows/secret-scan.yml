name: Secret Scan

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for committed secrets
        # Block any push that introduces a known secret pattern in
        # tracked files. Uses `git ls-files` so untracked working-tree
        # files (e.g. a developer's local server/.env) don't false-
        # positive the scan. The CI runner doesn't have those files
        # anyway, but the same rules then apply locally if the dev
        # runs this workflow with `act`.
        #
        # Patterns intentionally exclude placeholder strings used in
        # *.env.example / *.env.template / *.env.testing files (those
        # use literal "Dummy", "fake", "__UNSET__", "placeholder", or
        # "xxxxxxxxx" values).
        #
        # If this fails: ROTATE the leaked credential at its source,
        # delete it from the source file, and verify the file is in
        # .gitignore. Don't try to git filter-branch — the secret is
        # already public via the original push.
        run: |
          set -euo pipefail
          patterns=(
            'sk_live_[A-Za-z0-9]{20,}'
            'pk_live_[A-Za-z0-9]{20,}'
            're_[A-Za-z0-9]{4,}_[A-Za-z0-9]{18,}'
            'GOCSPX-[A-Za-z0-9_-]{20,}'
            'whsec_[A-Za-z0-9]{30,}'
            'AKIA[0-9A-Z]{16}'
            'ASIA[0-9A-Z]{16}'
          )
          fail=0
          # Build list of tracked files, excluding template / example /
          # testing fixtures. Bail early if no files match.
          mapfile -t files < <(git ls-files | grep -vE '\.(example|template|testing)$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tracked files to scan."
            exit 0
          fi
          for pat in "${patterns[@]}"; do
            hits=$(printf '%s\n' "${files[@]}" | xargs -d '\n' grep -EnH \
              --binary-files=without-match \
              "$pat" 2>/dev/null || true)
            # Filter out placeholder strings even within tracked files
            # (defensive — templates/examples are already excluded by
            # filename above).
            hits=$(echo "$hits" | grep -viE 'dummy|fake|placeholder|unset|xxxxxxxx|example' || true)
            if [ -n "$hits" ]; then
              echo "SECRET LEAK: pattern '$pat' matched in tracked files:"
              echo "$hits"
              echo "---"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo
            echo "::error::A secret-shaped string is committed in the repo."
            echo "::error::Rotate the credential, remove it from the source, and add the file to .gitignore."
            exit 1
          fi
          echo "No secret patterns found in tracked files."

      - name: Verify no .env file is tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' \
            | grep -vE '\.(example|template|testing)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real env file(s) tracked by git:"
            echo "$tracked"
            echo "::error::Add these to .gitignore and run 'git rm --cached <file>' to untrack."
            exit 1
          fi
          echo "No real env files are tracked. Templates only."
