name: Restore MinIO Console UI

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
    paths:
      - 'oracle/redis-minio/scripts/restore-console-ui.sh'
      - '.github/workflows/minio-restore-console.yml'

jobs:
  restore-console:
    name: Restore MinIO Console UI Access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/restore-console-ui.sh"
          target: "/tmp/blyss-minio/"
          strip_components: 3

      - name: Restore MinIO Console UI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Restoring MinIO Console UI..."

            cd /tmp/blyss-minio
            chmod +x restore-console-ui.sh

            # Run the configuration script
            sudo bash restore-console-ui.sh

            echo "✅ MinIO Console UI restored!"
