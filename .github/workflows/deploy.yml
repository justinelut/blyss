name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/blyss-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/blyss-web

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.API_IMAGE }}:latest,${{ env.API_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Create namespace if missing
            sudo kubectl get namespace blyss 2>/dev/null || sudo kubectl create namespace blyss

            # Create GHCR pull secret if missing
            sudo kubectl get secret ghcr-secret -n blyss 2>/dev/null || \
              sudo kubectl create secret docker-registry ghcr-secret -n blyss \
                --docker-server=ghcr.io \
                --docker-username=${{ github.actor }} \
                --docker-password=${{ secrets.GITHUB_TOKEN }}

            # Create app secrets if missing
            sudo kubectl get secret blyss-secrets -n blyss 2>/dev/null || \
              sudo kubectl create secret generic blyss-secrets -n blyss \
                --from-literal=POSTGRES_USER=blyss \
                --from-literal=POSTGRES_PASSWORD=changeme \
                --from-literal=MINIO_ROOT_USER=minioadmin \
                --from-literal=MINIO_ROOT_PASSWORD=changeme \
                --from-literal=SECRET=changeme-to-random-32chars

            # Apply manifests inline
            sudo kubectl apply -n blyss -f - <<'EOF'
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: blyss-web
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: blyss-web
              template:
                metadata:
                  labels:
                    app: blyss-web
                spec:
                  imagePullSecrets:
                    - name: ghcr-secret
                  containers:
                    - name: web
                      image: ghcr.io/${{ github.repository_owner }}/blyss-web:${{ github.sha }}
                      ports:
                        - containerPort: 3000
                      env:
                        - name: NEXT_PUBLIC_API_URL
                          value: "https://api.blyss.co.ke"
                      resources:
                        requests:
                          memory: 256Mi
                        limits:
                          memory: 512Mi
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: blyss-web
            spec:
              selector:
                app: blyss-web
              ports:
                - port: 80
                  targetPort: 3000
            EOF

            # Wait for rollout
            sudo kubectl rollout status deployment/blyss-web -n blyss --timeout=180s 2>/dev/null || echo "Web rollout pending"
            sudo kubectl get pods -n blyss

      - name: Smoke test
        continue-on-error: true
        run: |
          sleep 30
          curl -sf --max-time 10 https://blyss.co.ke/ > /dev/null && echo "✓ blyss.co.ke" || echo "✗ blyss.co.ke not ready yet"
          curl -sf --max-time 10 https://api.blyss.co.ke/healthz > /dev/null && echo "✓ api healthz" || echo "✗ api not ready yet"
