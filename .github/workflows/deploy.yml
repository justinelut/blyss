name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blyss-web
  K3S_NAMESPACE: blyss
  K3S_DEPLOYMENT: blyss-web

jobs:
  build:
    name: Build & push image (on server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build on ARM server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -e

            # Ensure repo exists on server
            if [ ! -d /opt/blyss/.git ]; then
              sudo rm -rf /opt/blyss
              sudo git clone https://${GHCR_USER}:${GHCR_TOKEN}@github.com/justinelut/blyss.git /opt/blyss
              sudo chown -R ubuntu:ubuntu /opt/blyss
            fi

            cd /opt/blyss

            # Update code
            git remote set-url origin https://${GHCR_USER}:${GHCR_TOKEN}@github.com/justinelut/blyss.git 2>/dev/null || true
            git fetch origin master
            git reset --hard origin/master

            # Login to GHCR
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Build web image
            sudo DOCKER_BUILDKIT=1 docker build \
              -t ghcr.io/justinelut/blyss-web:${IMAGE_TAG} \
              -t ghcr.io/justinelut/blyss-web:latest \
              -f clients/web/Dockerfile \
              clients/web/

            # Push to GHCR
            sudo docker push ghcr.io/justinelut/blyss-web:${IMAGE_TAG}
            sudo docker push ghcr.io/justinelut/blyss-web:latest

            # Cleanup
            sudo docker image prune -f

  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy manifests and roll
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN
          command_timeout: 10m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            NS=blyss
            DEP=blyss-web

            # 1. Ensure namespace
            sudo kubectl create namespace $NS 2>/dev/null || true

            # 2. Sync GHCR pull secret
            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --dry-run=client -o yaml \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PULL_TOKEN}" \
              | sudo kubectl apply -f -

            # 3. Apply manifests from repo on server
            cd /opt/blyss
            sudo kubectl apply -n $NS -f k8s/blyss-web.yaml

            # 4. Set new image
            sudo kubectl set image deployment/$DEP \
              web=ghcr.io/justinelut/blyss-web:${IMAGE_TAG} \
              -n $NS

            # 5. Wait for rollout with diagnostics
            sudo kubectl rollout status deployment/$DEP -n $NS --timeout=5m &
            ROLLOUT_PID=$!

            while kill -0 $ROLLOUT_PID 2>/dev/null; do
              sleep 10
              echo "---- $(date -u +%H:%M:%S) pod state ----"
              sudo kubectl -n $NS get pods -l app=blyss-web -o wide --no-headers 2>/dev/null || true
              POD=$(sudo kubectl -n $NS get pods -l app=blyss-web \
                --sort-by=.metadata.creationTimestamp \
                -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || echo "")
              if [ -n "$POD" ]; then
                echo "---- logs (last 15 lines) ----"
                sudo kubectl -n $NS logs "$POD" --tail=15 2>/dev/null || true
              fi
            done

            wait $ROLLOUT_PID || {
              echo "ROLLOUT FAILED — dumping diagnostics"
              sudo kubectl -n $NS describe deployment/$DEP 2>&1 | tail -30
              sudo kubectl -n $NS logs deployment/$DEP --tail=50 2>&1 || true
              sudo kubectl -n $NS logs deployment/$DEP --previous --tail=50 2>&1 || true
              exit 1
            }

            echo "✅ Deployed ghcr.io/justinelut/blyss-web:${IMAGE_TAG}"
            sudo kubectl -n $NS get pods
