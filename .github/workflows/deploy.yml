name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Build web image
  # ---------------------------------------------------------------------------
  build-web:
    name: Build web image (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          file: ./clients/web/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.blyss.co.ke
            NEXT_PUBLIC_FRONTEND_BASE_URL=https://blyss.co.ke
            NEXT_PUBLIC_CHECKOUT_BASE_URL=https://buy.blyss.co.ke
          tags: |
            ghcr.io/${{ github.repository_owner }}/blyss-web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/blyss-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # Build API image
  # ---------------------------------------------------------------------------
  build-api:
    name: Build API image (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/blyss-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/blyss-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ---------------------------------------------------------------------------
  # Deploy all manifests + roll deployments
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to K3s
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale manifests on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /opt/blyss/k8s
            sudo mkdir -p /opt/blyss/k8s
            sudo chown -R ubuntu:ubuntu /opt/blyss

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/*.yaml"
          target: "/opt/blyss/"
          strip_components: 0

      - name: Apply manifests and roll deployments
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_TAG: ${{ needs.build-web.outputs.tag }}
          API_TAG: ${{ needs.build-api.outputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Production secrets — populated from GitHub repo secrets.
          # Empty values stay as placeholders.
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: WEB_TAG,API_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN,PAYSTACK_SECRET_KEY,PAYSTACK_PUBLIC_KEY,PAYSTACK_WEBHOOK_SECRET,RESEND_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,APPLE_CLIENT_ID,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,SENTRY_DSN,POSTHOG_KEY
          command_timeout: 15m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            NS=blyss
            REPO_OWNER=justinelut

            # 1. Ensure namespace
            sudo kubectl create namespace $NS 2>/dev/null || true

            # 2. Sync GHCR pull secret
            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --dry-run=client -o yaml \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PULL_TOKEN}" \
              | sudo kubectl apply -f -

            # 3. Sync app secrets — uses POLAR_ prefix as the backend expects.
            # Always re-applies (idempotent) so adding/changing GitHub secrets
            # picks up on next deploy. Persistent values (POSTGRES_PASSWORD,
            # MINIO_PASSWORD, POLAR_SECRET) are read from existing secret if
            # present, otherwise generated.
            POSTGRES_PASS=$(sudo kubectl get secret blyss-secrets -n $NS -o jsonpath='{.data.POLAR_POSTGRES_PWD}' 2>/dev/null | base64 -d 2>/dev/null || openssl rand -hex 16)
            MINIO_PASS=$(sudo kubectl get secret blyss-secrets -n $NS -o jsonpath='{.data.POLAR_MINIO_PWD}' 2>/dev/null | base64 -d 2>/dev/null || openssl rand -hex 16)
            APP_SECRET=$(sudo kubectl get secret blyss-secrets -n $NS -o jsonpath='{.data.POLAR_SECRET}' 2>/dev/null | base64 -d 2>/dev/null || openssl rand -hex 32)

            sudo kubectl create secret generic blyss-secrets -n $NS \
              --dry-run=client -o yaml \
              --from-literal=POLAR_ENV=production \
              --from-literal=POLAR_LOG_LEVEL=INFO \
              --from-literal=POLAR_TESTING=0 \
              --from-literal=POLAR_SQLALCHEMY_DEBUG=0 \
              --from-literal=POLAR_DEFAULT_CURRENCY=KES \
              --from-literal=POLAR_CORS_ORIGINS='["https://blyss.co.ke","https://www.blyss.co.ke","https://buy.blyss.co.ke","https://my.blyss.co.ke"]' \
              --from-literal=POLAR_ALLOWED_HOSTS='["blyss.co.ke","www.blyss.co.ke","buy.blyss.co.ke","my.blyss.co.ke","api.blyss.co.ke"]' \
              --from-literal=POLAR_FRONTEND_BASE_URL=https://blyss.co.ke \
              --from-literal=POLAR_BASE_URL=https://api.blyss.co.ke \
              --from-literal=POLAR_CHECKOUT_BASE_URL=https://buy.blyss.co.ke/checkout/{client_secret} \
              --from-literal=POLAR_USER_SESSION_COOKIE_DOMAIN=blyss.co.ke \
              --from-literal=POLAR_SECRET="$APP_SECRET" \
              --from-literal=POLAR_POSTGRES_USER=blyss \
              --from-literal=POLAR_POSTGRES_PWD="$POSTGRES_PASS" \
              --from-literal=POLAR_POSTGRES_HOST=postgres \
              --from-literal=POLAR_POSTGRES_PORT=5432 \
              --from-literal=POLAR_POSTGRES_DATABASE=blyss \
              --from-literal=POLAR_POSTGRES_SSL_MODE= \
              --from-literal=POLAR_REDIS_HOST=redis \
              --from-literal=POLAR_REDIS_PORT=6379 \
              --from-literal=POLAR_REDIS_DB=0 \
              --from-literal=POLAR_REDIS_PASSWORD= \
              --from-literal=POLAR_REDIS_SSL=False \
              --from-literal=POLAR_MINIO_USER=blyssadmin \
              --from-literal=POLAR_MINIO_PWD="$MINIO_PASS" \
              --from-literal=POLAR_AWS_ACCESS_KEY_ID=blyssadmin \
              --from-literal=POLAR_AWS_SECRET_ACCESS_KEY="$MINIO_PASS" \
              --from-literal=POLAR_AWS_REGION=us-east-1 \
              --from-literal=POLAR_S3_ENDPOINT_URL=http://minio:9000 \
              --from-literal=POLAR_S3_PUBLIC_ENDPOINT_URL=https://cdn.blyss.co.ke \
              --from-literal=POLAR_S3_FILES_BUCKET_NAME=blyss-private \
              --from-literal=POLAR_S3_FILES_PUBLIC_BUCKET_NAME=blyss-public \
              --from-literal=POLAR_S3_CUSTOMER_INVOICES_BUCKET_NAME=blyss-private \
              --from-literal=POLAR_S3_PAYOUT_INVOICES_BUCKET_NAME=blyss-private \
              --from-literal=POLAR_EMAIL_SENDER=resend \
              --from-literal=POLAR_EMAIL_FROM_NAME=Blyss \
              --from-literal=POLAR_EMAIL_FROM_DOMAIN=notifications.blyss.co.ke \
              --from-literal=POLAR_EMAIL_FROM_LOCAL=hello \
              --from-literal=POLAR_EMAIL_DEFAULT_REPLY_TO_NAME="Blyss Support" \
              --from-literal=POLAR_EMAIL_DEFAULT_REPLY_TO_EMAIL_ADDRESS=hello@blyss.co.ke \
              --from-literal=POLAR_INVOICES_ADDITIONAL_INFO="Blyss · Nairobi" \
              --from-literal=POLAR_PLATFORM_FEE_BASIS_POINTS=2000 \
              --from-literal=POLAR_PLATFORM_FEE_FIXED=0 \
              --from-literal=POLAR_FAVICON_URL=https://cdn.blyss.co.ke/brand/favicon.png \
              --from-literal=POLAR_THUMBNAIL_URL=https://cdn.blyss.co.ke/brand/og-default.png \
              --from-literal=POLAR_PAYSTACK_SECRET_KEY="${PAYSTACK_SECRET_KEY:-sk_test_placeholder}" \
              --from-literal=POLAR_PAYSTACK_PUBLIC_KEY="${PAYSTACK_PUBLIC_KEY:-pk_test_placeholder}" \
              --from-literal=POLAR_PAYSTACK_WEBHOOK_SECRET="${PAYSTACK_WEBHOOK_SECRET:-placeholder}" \
              --from-literal=POLAR_RESEND_API_KEY="${RESEND_API_KEY:-}" \
              --from-literal=POLAR_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-}" \
              --from-literal=POLAR_GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET:-}" \
              --from-literal=POLAR_APPLE_CLIENT_ID="${APPLE_CLIENT_ID:-}" \
              --from-literal=POLAR_APPLE_TEAM_ID="${APPLE_TEAM_ID:-}" \
              --from-literal=POLAR_APPLE_KEY_ID="${APPLE_KEY_ID:-}" \
              --from-literal=POLAR_APPLE_KEY_VALUE="${APPLE_PRIVATE_KEY:-}" \
              --from-literal=POLAR_SENTRY_DSN="${SENTRY_DSN:-}" \
              --from-literal=POLAR_POSTHOG_PROJECT_API_KEY="${POSTHOG_KEY:-}" \
              --from-literal=POLAR_POSTHOG_DEBUG=0 \
              --from-literal=POLAR_STRIPE_SECRET_KEY=sk_test_dummy_unused \
              --from-literal=POLAR_STRIPE_PUBLISHABLE_KEY=pk_test_dummy_unused \
              --from-literal=POLAR_STRIPE_WEBHOOK_SECRET=whsec_dummy_unused \
              --from-literal=POLAR_STRIPE_CONNECT_WEBHOOK_SECRET=whsec_dummy_unused \
              | sudo kubectl apply -f -
            echo "✅ blyss-secrets synced"

            # 4. Apply all manifests
            for f in /opt/blyss/k8s/*.yaml; do
              echo "==> kubectl apply -f $f"
              # Postgres is a StatefulSet with immutable fields; once created,
              # most spec changes get rejected. Allow these to fail silently
              # since the running pod is still healthy.
              if [[ "$f" == *postgres* ]]; then
                sudo kubectl apply -f "$f" 2>&1 || echo "  (postgres apply skipped — non-template fields immutable)"
              else
                sudo kubectl apply -f "$f"
              fi
            done

            # 4b. Remove stale resources from prior monolithic manifest
            sudo kubectl delete deployment cloudflared -n $NS --ignore-not-found
            sudo kubectl delete configmap cloudflared-config -n $NS --ignore-not-found

            # 5. Update images
            sudo kubectl set image deployment/blyss-web web=ghcr.io/$REPO_OWNER/blyss-web:${WEB_TAG} -n $NS 2>/dev/null || true
            sudo kubectl set image deployment/blyss-api api=ghcr.io/$REPO_OWNER/blyss-api:${API_TAG} -n $NS 2>/dev/null || true
            sudo kubectl set image deployment/blyss-worker worker=ghcr.io/$REPO_OWNER/blyss-api:${API_TAG} -n $NS 2>/dev/null || true

            # 6. Wait for postgres + api before running migrations
            echo "==> Waiting for postgres"
            sudo kubectl rollout status statefulset/postgres -n $NS --timeout=3m 2>/dev/null || true
            echo "==> Waiting for api"
            sudo kubectl rollout status deployment/blyss-api -n $NS --timeout=5m 2>/dev/null || {
              echo "API rollout pending, dumping logs:"
              sudo kubectl -n $NS describe deployment/blyss-api 2>&1 | tail -20
              sudo kubectl -n $NS logs deployment/blyss-api --tail=30 2>&1 || true
            }

            # 7. Run migrations (idempotent — skips if up-to-date)
            echo "==> Running database migrations"
            API_POD=$(sudo kubectl -n $NS get pods -l app=blyss-api --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$API_POD" ]; then
              sudo kubectl -n $NS exec "$API_POD" -- uv run python -m scripts.db upgrade 2>&1 || \
                sudo kubectl -n $NS exec "$API_POD" -- python -m scripts.db upgrade 2>&1 || \
                echo "⚠️  Migration command failed"
            else
              echo "⚠️  No running API pod, skipping migrations"
            fi

            # 8. Seed admin user (idempotent)
            echo "==> Seeding admin user"
            if [ -n "$API_POD" ]; then
              sudo kubectl -n $NS exec "$API_POD" -- uv run python scripts/seed_admin.py justinequartz@gmail.com 2>&1 || \
                sudo kubectl -n $NS exec "$API_POD" -- python scripts/seed_admin.py justinequartz@gmail.com 2>&1 || \
                echo "⚠️  Admin seed failed (non-blocking)"
            fi

            # 9. Wait for web rollout
            echo "==> Waiting for web"
            sudo kubectl rollout status deployment/blyss-web -n $NS --timeout=5m 2>/dev/null || {
              echo "Web rollout pending, dumping logs:"
              sudo kubectl -n $NS describe deployment/blyss-web 2>&1 | tail -20
              sudo kubectl -n $NS logs deployment/blyss-web --tail=30 2>&1 || true
            }

            echo "✅ Deploy complete"
            sudo kubectl -n $NS get pods
