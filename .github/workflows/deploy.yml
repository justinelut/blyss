name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Build web image
  # ---------------------------------------------------------------------------
  build-web:
    name: Build web image (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          file: ./clients/web/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.blyss.co.ke
            NEXT_PUBLIC_FRONTEND_BASE_URL=https://blyss.co.ke
            NEXT_PUBLIC_CHECKOUT_BASE_URL=https://buy.blyss.co.ke
          tags: |
            ghcr.io/${{ github.repository_owner }}/blyss-web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/blyss-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # Build API image
  # ---------------------------------------------------------------------------
  build-api:
    name: Build API image (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/blyss-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/blyss-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ---------------------------------------------------------------------------
  # Deploy all manifests + roll deployments
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to K3s
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/*.yaml"
          target: "/opt/blyss/"
          strip_components: 0

      - name: Apply manifests and roll deployments
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_TAG: ${{ needs.build-web.outputs.tag }}
          API_TAG: ${{ needs.build-api.outputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Production secrets — populated from GitHub repo secrets.
          # Empty values stay as placeholders.
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: WEB_TAG,API_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN,PAYSTACK_SECRET_KEY,PAYSTACK_PUBLIC_KEY,PAYSTACK_WEBHOOK_SECRET,RESEND_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,APPLE_CLIENT_ID,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,SENTRY_DSN,POSTHOG_KEY
          command_timeout: 15m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            NS=blyss
            REPO_OWNER=justinelut

            # 1. Ensure namespace
            sudo kubectl create namespace $NS 2>/dev/null || true

            # 2. Sync GHCR pull secret
            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --dry-run=client -o yaml \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PULL_TOKEN}" \
              | sudo kubectl apply -f -

            # 3. Sync app secrets — always apply (idempotent), uses GH secrets if set
            POSTGRES_PASS=$(sudo kubectl get secret blyss-secrets -n $NS -o jsonpath='{.data.POSTGRES_PASSWORD}' 2>/dev/null | base64 -d 2>/dev/null || openssl rand -hex 16)
            MINIO_PASS=$(sudo kubectl get secret blyss-secrets -n $NS -o jsonpath='{.data.MINIO_ROOT_PASSWORD}' 2>/dev/null | base64 -d 2>/dev/null || openssl rand -hex 16)
            APP_SECRET=$(sudo kubectl get secret blyss-secrets -n $NS -o jsonpath='{.data.SECRET}' 2>/dev/null | base64 -d 2>/dev/null || openssl rand -hex 32)

            sudo kubectl create secret generic blyss-secrets -n $NS \
              --dry-run=client -o yaml \
              --from-literal=POSTGRES_USER=blyss \
              --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASS" \
              --from-literal=POSTGRES_HOST=postgres \
              --from-literal=POSTGRES_PORT=5432 \
              --from-literal=POSTGRES_DATABASE=blyss \
              --from-literal=REDIS_URL=redis://redis:6379/0 \
              --from-literal=MINIO_ROOT_USER=minioadmin \
              --from-literal=MINIO_ROOT_PASSWORD="$MINIO_PASS" \
              --from-literal=AWS_ACCESS_KEY_ID=minioadmin \
              --from-literal=AWS_SECRET_ACCESS_KEY="$MINIO_PASS" \
              --from-literal=AWS_S3_ENDPOINT=http://minio:9000 \
              --from-literal=AWS_S3_FILES_BUCKET=blyss-files \
              --from-literal=AWS_S3_PUBLIC_BUCKET=blyss-public \
              --from-literal=SECRET="$APP_SECRET" \
              --from-literal=POLAR_AUTH_COOKIE_KEY=polar_session \
              --from-literal=FRONTEND_BASE_URL=https://blyss.co.ke \
              --from-literal=CHECKOUT_BASE_URL=https://buy.blyss.co.ke \
              --from-literal=PLATFORM_NAME=Blyss \
              --from-literal=PLATFORM_FEE_BASIS_POINTS=2000 \
              --from-literal=EMAIL_FROM_NAME=Blyss \
              --from-literal=EMAIL_FROM_ADDRESS=hello@blyss.co.ke \
              --from-literal=PAYSTACK_SECRET_KEY="${PAYSTACK_SECRET_KEY:-sk_test_placeholder}" \
              --from-literal=PAYSTACK_PUBLIC_KEY="${PAYSTACK_PUBLIC_KEY:-pk_test_placeholder}" \
              --from-literal=PAYSTACK_WEBHOOK_SECRET="${PAYSTACK_WEBHOOK_SECRET:-placeholder}" \
              --from-literal=RESEND_API_KEY="${RESEND_API_KEY:-placeholder}" \
              --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-}" \
              --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET:-}" \
              --from-literal=APPLE_CLIENT_ID="${APPLE_CLIENT_ID:-}" \
              --from-literal=APPLE_TEAM_ID="${APPLE_TEAM_ID:-}" \
              --from-literal=APPLE_KEY_ID="${APPLE_KEY_ID:-}" \
              --from-literal=APPLE_PRIVATE_KEY="${APPLE_PRIVATE_KEY:-}" \
              --from-literal=SENTRY_DSN="${SENTRY_DSN:-}" \
              --from-literal=POSTHOG_KEY="${POSTHOG_KEY:-}" \
              | sudo kubectl apply -f -
            echo "✅ blyss-secrets synced"

            # 4. Apply all manifests
            for f in /opt/blyss/k8s/*.yaml; do
              echo "==> kubectl apply -f $f"
              sudo kubectl apply -f "$f"
            done

            # 5. Update images
            sudo kubectl set image deployment/blyss-web web=ghcr.io/$REPO_OWNER/blyss-web:${WEB_TAG} -n $NS 2>/dev/null || true
            sudo kubectl set image deployment/blyss-api api=ghcr.io/$REPO_OWNER/blyss-api:${API_TAG} -n $NS 2>/dev/null || true
            sudo kubectl set image deployment/blyss-worker worker=ghcr.io/$REPO_OWNER/blyss-api:${API_TAG} -n $NS 2>/dev/null || true

            # 6. Wait for postgres + api before running migrations
            echo "==> Waiting for postgres"
            sudo kubectl rollout status statefulset/postgres -n $NS --timeout=3m 2>/dev/null || true
            echo "==> Waiting for api"
            sudo kubectl rollout status deployment/blyss-api -n $NS --timeout=5m 2>/dev/null || {
              echo "API rollout pending, dumping logs:"
              sudo kubectl -n $NS describe deployment/blyss-api 2>&1 | tail -20
              sudo kubectl -n $NS logs deployment/blyss-api --tail=30 2>&1 || true
            }

            # 7. Run migrations (idempotent — skips if up-to-date)
            echo "==> Running database migrations"
            API_POD=$(sudo kubectl -n $NS get pods -l app=blyss-api --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$API_POD" ]; then
              sudo kubectl -n $NS exec "$API_POD" -- alembic upgrade head 2>&1 || \
                sudo kubectl -n $NS exec "$API_POD" -- uv run alembic upgrade head 2>&1 || \
                echo "⚠️  Migration command not found, may need manual run"
            else
              echo "⚠️  No running API pod, skipping migrations"
            fi

            # 8. Seed admin user (idempotent)
            echo "==> Seeding admin user"
            if [ -n "$API_POD" ]; then
              sudo kubectl -n $NS exec "$API_POD" -- python scripts/seed_admin.py justinequartz@gmail.com 2>&1 || \
                sudo kubectl -n $NS exec "$API_POD" -- uv run python scripts/seed_admin.py justinequartz@gmail.com 2>&1 || \
                echo "⚠️  Admin seed failed (non-blocking)"
            fi

            # 9. Wait for web rollout
            echo "==> Waiting for web"
            sudo kubectl rollout status deployment/blyss-web -n $NS --timeout=5m 2>/dev/null || {
              echo "Web rollout pending, dumping logs:"
              sudo kubectl -n $NS describe deployment/blyss-web 2>&1 | tail -20
              sudo kubectl -n $NS logs deployment/blyss-web --tail=30 2>&1 || true
            }

            echo "✅ Deploy complete"
            sudo kubectl -n $NS get pods
