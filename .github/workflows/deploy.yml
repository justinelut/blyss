name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Build web image (ARM64)
  # ---------------------------------------------------------------------------
  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          file: ./clients/web/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.blyss.co.ke
            NEXT_PUBLIC_FRONTEND_BASE_URL=https://blyss.co.ke
            NEXT_PUBLIC_CHECKOUT_BASE_URL=https://buy.blyss.co.ke
          tags: |
            ghcr.io/${{ github.repository_owner }}/blyss-web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/blyss-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # Build API image (ARM64)
  # ---------------------------------------------------------------------------
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/blyss-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/blyss-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to K3s
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # mints GITHUB_TOKEN with GHCR pull rights
    steps:
      - uses: actions/checkout@v4

      # Stage env + jwks files locally (single GitHub secrets each)
      - name: Stage env + jwks files on runner
        env:
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
          JWKS_SECRET: ${{ secrets.JWKS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${ENV_SECRET:-}" ]; then
            echo "::error::ENV_SECRET repo secret is empty."
            exit 1
          fi
          if [ -z "${JWKS_SECRET:-}" ]; then
            echo "::error::JWKS_SECRET repo secret is empty."
            exit 1
          fi
          mkdir -p k8s/_staged
          printf '%s\n' "$ENV_SECRET" > k8s/_staged/blyss.env.secret
          printf '%s\n' "$JWKS_SECRET" > k8s/_staged/.jwks.json
          # ─────────────────────────────────────────────────────────────────
          # AI provider keys — multi-provider FallbackModel chain.
          # ─────────────────────────────────────────────────────────────────
          # The analyzer (server/polar/organization_review/analyzer.py) builds
          # a chain of every available provider via pydantic-ai's
          # FallbackModel. We inject any GH secret that's set as the matching
          # POLAR_*_API_KEY env var. Setting POLAR_AI_PROVIDER=auto unlocks
          # chain mode; legacy single-provider deployments can still pin
          # POLAR_AI_PROVIDER=openai or =gemini inside ENV_SECRET to override.
          #
          # Each line below: strip any stale value from ENV_SECRET, then
          # append from the GH secret if it's set. Idempotent.
          inject_kv() {
            local key="$1" value="$2"
            grep -v "^${key}=" k8s/_staged/blyss.env.secret > k8s/_staged/blyss.env.secret.tmp || true
            mv k8s/_staged/blyss.env.secret.tmp k8s/_staged/blyss.env.secret
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> k8s/_staged/blyss.env.secret
            fi
          }

          # Default to auto-chain mode. We strip any existing
          # POLAR_AI_PROVIDER= line first so a stale `=gemini` or `=openai`
          # value left over from previous deploys can't override the new
          # default. To pin to a single provider on purpose, set
          # POLAR_AI_PROVIDER explicitly in ENV_SECRET _below this line_
          # — the inject runs before ENV_SECRET wins.
          grep -v '^POLAR_AI_PROVIDER=' k8s/_staged/blyss.env.secret > k8s/_staged/blyss.env.secret.tmp || true
          mv k8s/_staged/blyss.env.secret.tmp k8s/_staged/blyss.env.secret
          printf 'POLAR_AI_PROVIDER=auto\n' >> k8s/_staged/blyss.env.secret

          inject_kv POLAR_GOOGLE_AI_API_KEY "${GEMINI_API_KEY:-}"
          inject_kv POLAR_GROQ_API_KEY      "${GROQ_API_KEY:-}"
          inject_kv POLAR_OPENROUTER_API_KEY "${OPENROUTER_API_KEY:-}"
          inject_kv POLAR_CEREBRAS_API_KEY  "${CEREBRAS_API_KEY:-}"
          inject_kv POLAR_OPENAI_API_KEY    "${OPENAI_API_KEY:-}"

          # Blyss frontend origins get credentialed CORS (cookies allowed)
          inject_kv POLAR_CORS_ORIGINS "https://blyss.co.ke,https://www.blyss.co.ke,https://buy.blyss.co.ke"

          chmod 644 k8s/_staged/blyss.env.secret k8s/_staged/.jwks.json
          echo "Staged env: $(wc -l < k8s/_staged/blyss.env.secret) lines"
          echo "Staged jwks: $(wc -c < k8s/_staged/.jwks.json) bytes"
          echo "AI providers configured:"
          for k in POLAR_GROQ_API_KEY POLAR_CEREBRAS_API_KEY POLAR_OPENROUTER_API_KEY POLAR_GOOGLE_AI_API_KEY POLAR_OPENAI_API_KEY; do
            if grep -q "^${k}=" k8s/_staged/blyss.env.secret; then
              echo "  $k: set"
            else
              echo "  $k: unset"
            fi
          done

      - name: Wipe stale manifest dir on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /opt/blyss/k8s
            sudo mkdir -p /opt/blyss/k8s
            sudo chown -R ubuntu:ubuntu /opt/blyss

      - name: Copy manifests + secrets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/blyss-api.yaml,k8s/blyss-web.yaml,k8s/postgres.yaml,k8s/redis.yaml,k8s/minio.yaml,k8s/backup-cronjob.yaml,k8s/_staged/blyss.env.secret,k8s/_staged/.jwks.json"
          target: "/opt/blyss/k8s/"
          strip_components: 1

      - name: Apply manifests + roll deployments
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_TAG: ${{ needs.build-web.outputs.tag }}
          API_TAG: ${{ needs.build-api.outputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: WEB_TAG,API_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN
          command_timeout: 15m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=blyss
            REPO_OWNER=justinelut
            ENV_FILE=/opt/blyss/k8s/_staged/blyss.env.secret
            JWKS_FILE=/opt/blyss/k8s/_staged/.jwks.json

            # Files might land at /opt/blyss/k8s/blyss.env.secret or /opt/blyss/k8s/_staged/...
            # Find them
            [ ! -s "$ENV_FILE" ] && ENV_FILE=/opt/blyss/k8s/blyss.env.secret
            [ ! -s "$JWKS_FILE" ] && JWKS_FILE=/opt/blyss/k8s/.jwks.json

            if [ ! -s "$ENV_FILE" ]; then
              echo "::error::Env file missing — searched _staged/blyss.env.secret and blyss.env.secret"
              find /opt/blyss/k8s -type f
              exit 1
            fi

            # 1. Namespace
            sudo kubectl create namespace $NS 2>/dev/null || true

            # 2. GHCR pull secret
            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --dry-run=client -o yaml \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PULL_TOKEN}" \
              --docker-email="ops@blyss.co.ke" \
              | sudo kubectl apply -f -
            echo "✅ ghcr-secret synced"

            # 3. App env secret (from single multi-line file)
            sudo kubectl create secret generic blyss-secrets -n $NS \
              --from-env-file="$ENV_FILE" \
              --dry-run=client -o yaml \
              | sudo kubectl apply -f -
            echo "✅ blyss-secrets synced from $(wc -l < $ENV_FILE) env lines"

            # 4. JWKS secret (RSA key file mounted as volume)
            sudo kubectl create secret generic blyss-jwks -n $NS \
              --from-file=.jwks.json="$JWKS_FILE" \
              --dry-run=client -o yaml \
              | sudo kubectl apply -f -
            echo "✅ blyss-jwks synced"

            # 5. Wipe staged secrets from server
            sudo rm -f "$ENV_FILE" "$JWKS_FILE"
            sudo rm -rf /opt/blyss/k8s/_staged

            # 6. Apply manifests (postgres apply non-fatal — immutable fields)
            # Jobs have an immutable spec, so delete the bucket-init Job first
            # to let it be recreated cleanly on every deploy.
            sudo kubectl delete job minio-init -n $NS --ignore-not-found
            for f in /opt/blyss/k8s/*.yaml; do
              echo "==> kubectl apply -f $f"
              if [[ "$f" == *postgres* ]]; then
                sudo kubectl apply -f "$f" 2>&1 || echo "  (postgres apply skipped — non-template fields immutable)"
              else
                sudo kubectl apply -f "$f"
              fi
            done

            # Cleanup legacy
            sudo kubectl delete deployment cloudflared -n $NS --ignore-not-found
            sudo kubectl delete configmap cloudflared-config -n $NS --ignore-not-found

            # 7. Update images
            sudo kubectl set image deployment/blyss-web web=ghcr.io/$REPO_OWNER/blyss-web:${WEB_TAG} -n $NS 2>/dev/null || true
            sudo kubectl set image deployment/blyss-api api=ghcr.io/$REPO_OWNER/blyss-api:${API_TAG} -n $NS 2>/dev/null || true
            sudo kubectl set image deployment/blyss-worker worker=ghcr.io/$REPO_OWNER/blyss-api:${API_TAG} -n $NS 2>/dev/null || true

            # 8. Wait for postgres + api
            sudo kubectl rollout status statefulset/postgres -n $NS --timeout=3m 2>/dev/null || true
            sudo kubectl rollout status deployment/blyss-api -n $NS --timeout=5m 2>/dev/null || {
              echo "API rollout pending; continuing"
            }

            # 9. Run migrations
            API_POD=$(sudo kubectl -n $NS get pods -l app=blyss-api --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$API_POD" ]; then
              echo "==> Running alembic migrations"
              sudo kubectl -n $NS exec "$API_POD" -- sh -c "cd /app/server && uv run alembic upgrade head" 2>&1 || \
                echo "⚠️  Migration command failed (use the Cluster reset workflow if schema is out of sync)"
              echo "==> Seeding admin"
              sudo kubectl -n $NS exec "$API_POD" -- sh -c "cd /app/server && uv run python -m scripts.seed_admin justinequartz@gmail.com" 2>&1 || \
                echo "⚠️  Admin seed failed (non-blocking)"
            else
              echo "⚠️  No running API pod; skipping migrations + seed"
            fi

            # 10. Web rollout
            sudo kubectl rollout status deployment/blyss-web -n $NS --timeout=5m 2>/dev/null || true

            # 11. Final state
            echo "════════════════════════════"
            echo " Final state"
            echo "════════════════════════════"
            sudo kubectl -n $NS get pods -o wide
            echo ""
            echo "═══ blyss-api logs (last 50) ═══"
            sudo kubectl -n $NS logs deployment/blyss-api --tail=50 --all-containers=true 2>&1 || true

            echo "✅ Deploy complete"
