name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/blyss-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/blyss-web

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.API_IMAGE }}:latest,${{ env.API_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull latest images and restart
            kubectl set image deployment/blyss-api api=${{ env.API_IMAGE }}:${{ github.sha }} -n blyss
            kubectl set image deployment/blyss-worker worker=${{ env.API_IMAGE }}:${{ github.sha }} -n blyss
            kubectl set image deployment/blyss-web web=${{ env.WEB_IMAGE }}:${{ github.sha }} -n blyss
            kubectl rollout status deployment/blyss-api -n blyss --timeout=120s
            kubectl rollout status deployment/blyss-web -n blyss --timeout=120s

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://blyss.co.ke/ > /dev/null
          curl -sf https://api.blyss.co.ke/healthz > /dev/null
          curl -sf https://blyss.co.ke/sitemap.xml > /dev/null
          echo "Smoke tests passed"
