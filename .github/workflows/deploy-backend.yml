name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'oracle/backend/scripts/update.sh'
      - 'oracle/backend/scripts/common.sh'
      - 'oracle/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."
            cd /opt/blyss/blyss/oracle/backend/scripts

            # Ensure scripts are executable
            sudo chmod +x *.sh

            # Run comprehensive fix to ensure everything is configured
            echo "Running comprehensive fix and update..."
            sudo bash fix-all.sh

            echo "✅ Deployment completed!"

            # Show final status
            echo ""
            echo "Service Status:"
            sudo systemctl status blyss-api --no-pager -l | head -n 8

