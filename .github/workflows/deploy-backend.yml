name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'oracle/backend/scripts/update.sh'
      - 'oracle/backend/scripts/common.sh'
      - 'oracle/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."

            # Navigate to repository root
            cd /opt/blyss/blyss

            # Pull latest changes
            echo "Pulling latest code..."
            sudo -u blyss git fetch origin
            sudo -u blyss git reset --hard origin/master

            # Sync .env.production to .env
            echo "Syncing .env.production to .env..."
            if [ -f "server/.env.production" ]; then
                sudo cp server/.env.production server/.env
                sudo chown blyss:blyss server/.env
                sudo chmod 600 server/.env
                echo "✅ .env updated from .env.production"
            else
                echo "❌ .env.production not found!"
                exit 1
            fi

            # Install/update dependencies
            echo "Updating Python dependencies..."
            cd server
            sudo -u blyss /home/blyss/.local/bin/uv sync

            # Run migrations
            echo "Running database migrations..."
            sudo -u blyss /home/blyss/.local/bin/uv run task db_migrate

            # Sync waitlist users
            echo "Syncing waitlist users..."
            if [ -f "scripts/users.json" ]; then
                sudo -u blyss /home/blyss/.local/bin/uv run python -m scripts.sync_waitlist_users || echo "⚠️  User sync failed, continuing..."
                echo "✅ Waitlist users synced"
            else
                echo "ℹ️  users.json not found, skipping user sync"
            fi

            # Build backoffice static assets
            echo "Building backoffice static assets..."
            cd polar/backoffice
            sudo -u blyss pnpm install --frozen-lockfile
            sudo -u blyss pnpm run build
            cd ../..
            echo "✅ Backoffice assets built"

            # Restart services
            echo "Restarting services..."
            sudo systemctl daemon-reload
            sudo systemctl restart blyss-api
            sudo systemctl restart blyss-worker

            # Wait for services to start
            sleep 5

            echo "✅ Deployment completed!"

            # Show final status
            echo ""
            echo "Service Status:"
            sudo systemctl status blyss-api --no-pager -l | head -n 8

