name: Enable MinIO Console Access

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
    paths:
      - 'oracle/redis-minio/scripts/enable-console-access.sh'
      - '.github/workflows/minio-console-access.yml'

jobs:
  enable-console:
    name: Enable MinIO Console Browser Access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/enable-console-access.sh"
          target: "/tmp/blyss-minio/"
          strip_components: 3

      - name: Enable MinIO Console Access
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Enabling MinIO Console Access..."

            cd /tmp/blyss-minio
            chmod +x enable-console-access.sh

            # Run the configuration script
            sudo bash enable-console-access.sh

            echo "✅ MinIO Console access enabled!"
