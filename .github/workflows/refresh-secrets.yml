name: Refresh Secrets & Restart

# Lightweight workflow: re-applies ENV_SECRET + JWKS_SECRET to K8s and rolls
# the API + worker without rebuilding any images. Use this when you change
# values in ENV_SECRET (Paystack keys, OAuth, etc.) and just need pods to
# reload the new env. Saves 5+ minutes of build time per env tweak.

on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Stage env + jwks files
        env:
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
          JWKS_SECRET: ${{ secrets.JWKS_SECRET }}
        run: |
          if [ -z "${ENV_SECRET:-}" ] || [ -z "${JWKS_SECRET:-}" ]; then
            echo "::error::Missing ENV_SECRET or JWKS_SECRET"
            exit 1
          fi
          mkdir -p staged
          printf '%s\n' "$ENV_SECRET" > staged/blyss.env.secret
          printf '%s\n' "$JWKS_SECRET" > staged/.jwks.json

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "staged/blyss.env.secret,staged/.jwks.json"
          target: "/opt/blyss/_refresh/"
          strip_components: 1

      - name: Apply secrets + rollout restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=blyss

            sudo kubectl create secret generic blyss-secrets -n $NS \
              --from-env-file=/opt/blyss/_refresh/blyss.env.secret \
              --dry-run=client -o yaml | sudo kubectl apply -f -
            echo "✅ blyss-secrets refreshed"

            sudo kubectl create secret generic blyss-jwks -n $NS \
              --from-file=.jwks.json=/opt/blyss/_refresh/.jwks.json \
              --dry-run=client -o yaml | sudo kubectl apply -f -
            echo "✅ blyss-jwks refreshed"

            sudo rm -rf /opt/blyss/_refresh

            echo "==> Rolling restart"
            sudo kubectl rollout restart deployment/blyss-api -n $NS
            sudo kubectl rollout restart deployment/blyss-worker -n $NS
            sudo kubectl rollout status deployment/blyss-api -n $NS --timeout=3m 2>/dev/null || true

            echo ""
            echo "═══ Pods ═══"
            sudo kubectl -n $NS get pods
            echo ""
            echo "═══ API logs (last 30) ═══"
            sudo kubectl -n $NS logs deployment/blyss-api --tail=30 2>&1 || true
