name: Setup MinIO API Subdomain

on:
  workflow_dispatch: # Manual trigger only

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/setup-api-subdomain.sh"
          target: "/tmp/blyss-minio/"
          strip_components: 3

      - name: Setup s3.blyss.co.ke for MinIO API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Setting up MinIO API subdomain..."

            cd /tmp/blyss-minio
            chmod +x setup-api-subdomain.sh

            sudo bash setup-api-subdomain.sh

            echo "✅ Setup complete!"
