name: Quick Fix MinIO Nginx

on:
  workflow_dispatch: # Manual trigger only
  push:
    branches:
      - master
    paths:
      - 'oracle/redis-minio/scripts/quick-fix-nginx.sh'
      - '.github/workflows/quick-fix-minio.yml'

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy scripts to MinIO server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/*.sh"
          target: "/tmp/"
          strip_components: 3

      - name: Apply fixes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Applying fixes..."
            cd /tmp

            # Fix 1: Update Nginx configuration
            if [ -f "quick-fix-nginx.sh" ]; then
              echo "Applying Nginx fix..."
              chmod +x quick-fix-nginx.sh
              sudo bash quick-fix-nginx.sh
            fi

            # Fix 2: Set MINIO_SERVER_URL
            if [ -f "fix-minio-server-url.sh" ]; then
              echo "Applying MinIO Server URL fix..."
              chmod +x fix-minio-server-url.sh
              sudo bash fix-minio-server-url.sh
            fi

            echo "✅ All fixes applied!"
