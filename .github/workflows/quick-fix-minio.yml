name: Quick Fix MinIO Nginx

on:
  workflow_dispatch: # Manual trigger only
  push:
    branches:
      - master
    paths:
      - 'oracle/redis-minio/scripts/quick-fix-nginx.sh'
      - '.github/workflows/quick-fix-minio.yml'

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/quick-fix-nginx.sh"
          target: "/tmp/"
          strip_components: 3

      - name: Apply quick fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Applying quick fix..."
            cd /tmp
            chmod +x quick-fix-nginx.sh
            sudo bash quick-fix-nginx.sh
            echo "✅ Done!"
