name: Cluster reset (DESTRUCTIVE)

# One-shot teardown + clean rebuild of the Blyss namespace.
#
# Wipes EVERYTHING: pods, deployments, services, the Postgres PVC (all DB
# data), the MinIO PVC (all uploaded files), every secret. Then recreates the
# namespace, syncs ENV_SECRET + JWKS_SECRET, applies the manifests, runs
# alembic migrations, seeds admin, and verifies /healthz.
#
# Trigger via:  gh workflow run "Cluster reset (DESTRUCTIVE)" -f confirm=RESET
# Or via the Actions tab → "Run workflow" → confirm = RESET
#
# Uses :latest images on GHCR (assumes a recent successful build via the
# Build & Deploy workflow). Use Build & Deploy first if images are stale.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm full namespace + PVC wipe'
        required: true
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  reset:
    name: Wipe + rebuild blyss namespace
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'RESET' }}
    permissions:
      contents: read
      packages: read   # mints GITHUB_TOKEN with GHCR pull rights for ghcr-secret
    steps:
      - uses: actions/checkout@v4

      - name: Stage env + jwks files on runner
        env:
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
          JWKS_SECRET: ${{ secrets.JWKS_SECRET }}
        run: |
          if [ -z "${ENV_SECRET:-}" ]; then
            echo "::error::ENV_SECRET is empty"; exit 1; fi
          if [ -z "${JWKS_SECRET:-}" ]; then
            echo "::error::JWKS_SECRET is empty"; exit 1; fi
          mkdir -p k8s/_staged
          printf '%s\n' "$ENV_SECRET" > k8s/_staged/blyss.env.secret
          printf '%s\n' "$JWKS_SECRET" > k8s/_staged/.jwks.json
          chmod 644 k8s/_staged/*

      - name: Wipe + recreate manifest dir on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /opt/blyss/k8s
            sudo mkdir -p /opt/blyss/k8s
            sudo chown -R ubuntu:ubuntu /opt/blyss

      - name: Copy manifests + staged secrets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/blyss-api.yaml,k8s/blyss-web.yaml,k8s/postgres.yaml,k8s/redis.yaml,k8s/minio.yaml,k8s/backup-cronjob.yaml,k8s/_staged/blyss.env.secret,k8s/_staged/.jwks.json"
          target: "/opt/blyss/k8s/"
          strip_components: 1

      - name: Reset cluster and rebuild from scratch
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_PULL_TOKEN
          command_timeout: 20m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=blyss
            REPO_OWNER=justinelut
            ENV_FILE=/opt/blyss/k8s/_staged/blyss.env.secret
            JWKS_FILE=/opt/blyss/k8s/_staged/.jwks.json
            [ ! -s "$ENV_FILE" ] && ENV_FILE=/opt/blyss/k8s/blyss.env.secret
            [ ! -s "$JWKS_FILE" ] && JWKS_FILE=/opt/blyss/k8s/.jwks.json
            if [ ! -s "$ENV_FILE" ]; then
              echo "::error::Env file missing"
              find /opt/blyss/k8s -type f
              exit 1
            fi

            echo "════════════════════════════"
            echo " 1. Wiping namespace $NS (cascades all PVCs + secrets + pods)"
            echo "════════════════════════════"
            sudo kubectl delete namespace $NS --ignore-not-found --wait=true --timeout=5m || true
            # Defensive: PVCs sometimes hang; force-delete any stragglers
            for pvc in $(sudo kubectl get pvc -n $NS -o name 2>/dev/null || true); do
              sudo kubectl patch -n $NS "$pvc" -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true
            done
            sleep 5

            echo "════════════════════════════"
            echo " 2. Recreating namespace + secrets"
            echo "════════════════════════════"
            sudo kubectl create namespace $NS

            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PULL_TOKEN}" \
              --docker-email="ops@blyss.co.ke"
            echo "✅ ghcr-secret"

            sudo kubectl create secret generic blyss-secrets -n $NS \
              --from-env-file="$ENV_FILE"
            echo "✅ blyss-secrets ($(wc -l < $ENV_FILE) keys)"

            sudo kubectl create secret generic blyss-jwks -n $NS \
              --from-file=.jwks.json="$JWKS_FILE"
            echo "✅ blyss-jwks"

            # Wipe staged secrets from server
            sudo rm -f "$ENV_FILE" "$JWKS_FILE"
            sudo rm -rf /opt/blyss/k8s/_staged

            echo "════════════════════════════"
            echo " 3. Applying manifests (postgres + redis + minio first)"
            echo "════════════════════════════"
            for f in postgres.yaml redis.yaml minio.yaml blyss-api.yaml blyss-web.yaml backup-cronjob.yaml; do
              echo "==> kubectl apply -f $f"
              sudo kubectl apply -f /opt/blyss/k8s/$f
            done

            echo "════════════════════════════"
            echo " 4. Waiting for postgres to be ready (fresh init w/ ENV_SECRET password)"
            echo "════════════════════════════"
            sudo kubectl rollout status statefulset/postgres -n $NS --timeout=5m

            echo "════════════════════════════"
            echo " 5. Waiting for blyss-api pod to start"
            echo "════════════════════════════"
            # We don't wait for /healthz here because migrations haven't run yet.
            # Just wait for the pod to be in Running phase.
            for i in $(seq 1 30); do
              POD=$(sudo kubectl -n $NS get pods -l app=blyss-api -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
              PHASE=$(sudo kubectl -n $NS get pod "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pending")
              if [ "$PHASE" = "Running" ]; then echo "API pod $POD is Running"; break; fi
              echo "Waiting for API pod ($i/30, phase=$PHASE)..."
              sleep 6
            done

            API_POD=$(sudo kubectl -n $NS get pods -l app=blyss-api -o jsonpath='{.items[0].metadata.name}')
            if [ -z "$API_POD" ]; then echo "::error::No API pod"; exit 1; fi

            echo "════════════════════════════"
            echo " 6. Running alembic migrations from /app/server"
            echo "════════════════════════════"
            sudo kubectl -n $NS exec "$API_POD" -- sh -c "cd /app/server && uv run alembic upgrade head" || {
              echo "::error::Migration failed — see logs above"
              sudo kubectl -n $NS logs "$API_POD" --tail=50
              exit 1
            }

            echo "════════════════════════════"
            echo " 7. Seeding admin user"
            echo "════════════════════════════"
            sudo kubectl -n $NS exec "$API_POD" -- sh -c "cd /app/server && uv run python scripts/seed_admin.py justinequartz@gmail.com" || \
              echo "⚠️  Admin seed failed (non-blocking — re-run scripts/seed_admin.py manually)"

            echo "════════════════════════════"
            echo " 8. Restarting API + web so they pick up the migrated DB"
            echo "════════════════════════════"
            sudo kubectl -n $NS rollout restart deployment/blyss-api
            sudo kubectl -n $NS rollout restart deployment/blyss-web
            sudo kubectl -n $NS rollout restart deployment/blyss-worker 2>/dev/null || true

            sudo kubectl rollout status deployment/blyss-api -n $NS --timeout=5m
            sudo kubectl rollout status deployment/blyss-web -n $NS --timeout=5m

            echo "════════════════════════════"
            echo " 9. Final health check"
            echo "════════════════════════════"
            sudo kubectl -n $NS get pods -o wide
            echo
            echo "API readiness:"
            for i in $(seq 1 12); do
              if sudo kubectl -n $NS exec "$(sudo kubectl -n $NS get pods -l app=blyss-api -o jsonpath='{.items[0].metadata.name}')" -- curl -fsS http://localhost:10000/healthz; then
                echo " ✅ API healthy"; break
              fi
              echo "Waiting for /healthz ($i/12)..."; sleep 5
            done

            echo
            echo "✅ Cluster reset complete"
            echo "Visit https://blyss.co.ke and https://api.blyss.co.ke/healthz to verify externally"

  guard:
    name: Confirm input
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm != 'RESET' }}
    steps:
      - run: |
          echo "::error::confirm input was '${{ github.event.inputs.confirm }}'. You must type RESET (uppercase) to run this destructive workflow."
          exit 1
