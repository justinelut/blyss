name: Seed Admin + Import Users

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Email to promote to backoffice admin"
        required: true
        default: "justinequartz@gmail.com"
      run_import:
        description: "Also import server/scripts/users.json (true/false)"
        required: true
        default: "true"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Run seed inside API pod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=blyss
            POD=$(sudo kubectl -n $NS get pods -l app=blyss-api -o jsonpath='{.items[0].metadata.name}')
            if [ -z "$POD" ]; then
              echo "::error::No blyss-api pod found"
              exit 1
            fi
            echo "Using pod: $POD"

            # The image's ADD . /app/server/ already places the scripts at
            # /app/server/scripts/. Run them in-place via uv run.
            echo ""
            echo "═══════════════════════════════════════"
            echo " 1. seed_admin: ${{ inputs.admin_email }}"
            echo "═══════════════════════════════════════"
            sudo kubectl -n $NS exec "$POD" -- sh -c "cd /app/server && PYTHONPATH=/app/server uv run python scripts/seed_admin.py '${{ inputs.admin_email }}'"

            if [ "${{ inputs.run_import }}" = "true" ]; then
              echo ""
              echo "═══════════════════════════════════════"
              echo " 2. import_users: scripts/users.json"
              echo "═══════════════════════════════════════"
              sudo kubectl -n $NS exec "$POD" -- sh -c "cd /app/server && PYTHONPATH=/app/server uv run python scripts/import_users.py scripts/users.json"
            else
              echo "Skipping users.json import (run_import=${{ inputs.run_import }})"
            fi

            # Confirm admin landed
            echo ""
            echo "═══════════════════════════════════════"
            echo " 3. Verify admin row"
            echo "═══════════════════════════════════════"
            PG=$(sudo kubectl -n $NS get pods -l app=postgres -o jsonpath='{.items[0].metadata.name}')
            sudo kubectl -n $NS exec "$PG" -- sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"select id, email, is_admin, email_verified from users where lower(email) = lower('${{ inputs.admin_email }}');\""

            echo ""
            echo "═══════════════════════════════════════"
            echo " 4. Total users in DB"
            echo "═══════════════════════════════════════"
            sudo kubectl -n $NS exec "$PG" -- sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"select count(*) as total_users from users;\""
