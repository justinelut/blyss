name: Seed Admin + Import Users

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Email to promote to backoffice admin"
        required: true
        default: "justinequartz@gmail.com"
      run_import:
        description: "Also import server/scripts/users.json (true/false)"
        required: true
        default: "true"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage scripts on runner
        run: |
          mkdir -p _staged
          cp server/scripts/seed_admin.py    _staged/
          cp server/scripts/import_users.py  _staged/
          cp server/scripts/users.json       _staged/

      - name: Copy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "_staged/seed_admin.py,_staged/import_users.py,_staged/users.json"
          target: "/tmp/blyss-seed/"
          strip_components: 1

      - name: Run seed inside API pod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=blyss
            POD=$(sudo kubectl -n $NS get pods -l app=blyss-api -o jsonpath='{.items[0].metadata.name}')
            if [ -z "$POD" ]; then
              echo "::error::No blyss-api pod found"
              exit 1
            fi
            echo "Using pod: $POD"

            # Copy scripts into the API pod's working directory
            sudo kubectl -n $NS cp /tmp/blyss-seed/seed_admin.py    "$POD:/tmp/seed_admin.py"
            sudo kubectl -n $NS cp /tmp/blyss-seed/import_users.py  "$POD:/tmp/import_users.py"
            sudo kubectl -n $NS cp /tmp/blyss-seed/users.json       "$POD:/tmp/users.json"

            echo ""
            echo "═══════════════════════════════════════"
            echo " 1. seed_admin: ${{ inputs.admin_email }}"
            echo "═══════════════════════════════════════"
            sudo kubectl -n $NS exec "$POD" -- sh -c "cd /app/server && uv run python /tmp/seed_admin.py '${{ inputs.admin_email }}'"

            if [ "${{ inputs.run_import }}" = "true" ]; then
              echo ""
              echo "═══════════════════════════════════════"
              echo " 2. import_users: /tmp/users.json"
              echo "═══════════════════════════════════════"
              sudo kubectl -n $NS exec "$POD" -- sh -c "cd /app/server && uv run python /tmp/import_users.py /tmp/users.json"
            else
              echo "Skipping users.json import (run_import=${{ inputs.run_import }})"
            fi

            # Confirm admin landed
            echo ""
            echo "═══════════════════════════════════════"
            echo " 3. Verify admin row"
            echo "═══════════════════════════════════════"
            PG=$(sudo kubectl -n $NS get pods -l app=postgres -o jsonpath='{.items[0].metadata.name}')
            sudo kubectl -n $NS exec "$PG" -- sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"select id, email, is_admin, email_verified from users where lower(email) = lower('${{ inputs.admin_email }}');\""

            # Cleanup
            rm -rf /tmp/blyss-seed
