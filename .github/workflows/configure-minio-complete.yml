name: Configure MinIO (Complete)

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
    paths:
      - 'oracle/redis-minio/scripts/configure-minio.sh'
      - '.github/workflows/configure-minio-complete.yml'

jobs:
  configure-minio:
    name: Complete MinIO Configuration (SSL + CORS + Console)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy script to MinIO server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          source: "oracle/redis-minio/scripts/configure-minio.sh"
          target: "/tmp/blyss-minio/"
          strip_components: 3

      - name: Run Complete MinIO Configuration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIO_HOST }}
          username: ubuntu
          key: ${{ secrets.MINIO_SSH_KEY }}
          script: |
            echo "🚀 Running complete MinIO configuration..."

            cd /tmp/blyss-minio
            chmod +x configure-minio.sh

            # Run the complete configuration script
            sudo bash configure-minio.sh

            echo "✅ MinIO configuration completed!"
