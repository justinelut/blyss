# =============================================================================
# Blyss server — local dev infra
#
# Brings up the four services Polar needs in development:
#   postgres  (port 5436)  — primary database
#   redis     (port 6380)  — cache + queue
#   minio     (ports 9000 + 9001) — S3-compatible object storage
#   minio-init             — one-shot job that creates blyss-public + blyss-private
#
# Polar's email path is logger|resend; no SMTP service in dev (Mailhog excluded).
# Magic-link codes appear in API stdout; run dev/email_login_code_notifier.py
# to surface them in a friendlier form.
#
# All values are read from server/.env via env interpolation.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: blyss-postgres
    environment:
      POSTGRES_USER: ${POLAR_POSTGRES_USER:-blyss}
      POSTGRES_PASSWORD: ${POLAR_POSTGRES_PWD:-blyss}
      POSTGRES_DB: ${POLAR_POSTGRES_DATABASE:-blyss}
    ports:
      - "${POLAR_POSTGRES_PORT:-5436}:5432"
    volumes:
      - blyss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POLAR_POSTGRES_USER:-blyss} -d ${POLAR_POSTGRES_DATABASE:-blyss}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blyss-redis
    ports:
      - "${POLAR_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: blyss-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${POLAR_MINIO_USER:-blyssadmin}
      MINIO_ROOT_PASSWORD: ${POLAR_MINIO_PWD:-blyssadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - blyss_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # One-shot job: creates the buckets and sets the public-bucket policy,
    # then exits. Runs once each time `docker compose up` is called.
    image: minio/mc:latest
    container_name: blyss-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${POLAR_MINIO_USER:-blyssadmin} ${POLAR_MINIO_PWD:-blyssadmin} &&
      mc mb -p local/${POLAR_S3_FILES_PUBLIC_BUCKET_NAME:-blyss-public} &&
      mc mb -p local/${POLAR_S3_FILES_BUCKET_NAME:-blyss-private} &&
      mc anonymous set download local/${POLAR_S3_FILES_PUBLIC_BUCKET_NAME:-blyss-public} &&
      echo 'Buckets created: ${POLAR_S3_FILES_PUBLIC_BUCKET_NAME:-blyss-public} (public) + ${POLAR_S3_FILES_BUCKET_NAME:-blyss-private} (private)'
      "

volumes:
  blyss_postgres_data:
    driver: local
  blyss_minio_data:
    driver: local
