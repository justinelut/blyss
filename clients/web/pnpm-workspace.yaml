packages:
  - "."

# pnpm 11+ requires explicit approval for packages with build scripts.
# These deps need to run their postinstall to set up native binaries / native
# bindings (Sharp for image processing, esbuild bundler, unrs-resolver for
# resolving paths in Rust, sentry-cli for sourcemap upload, protobufjs codegen,
# core-js patcher).
allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
