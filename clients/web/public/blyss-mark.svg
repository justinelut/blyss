<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Blyss mark">
  <!--
    Blyss glyph — a single warm-orange "B" letterform on a near-black square
    with our paper accent. Used at favicon, app-icon, and social card size.
  -->
  <rect width="64" height="64" rx="14" fill="#0F0E0C"/>
  <text
    x="50%"
    y="56%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Inter Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="42"
    font-weight="800"
    letter-spacing="-1"
    fill="#F97316"
  >B</text>
  <!-- Tiny accent dot, matches the wordmark's signature -->
  <circle cx="46" cy="50" r="2.5" fill="#FAFAF7"/>
</svg>
