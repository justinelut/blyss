<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none" role="img" aria-label="Blyss">
  <!--
    Blyss wordmark.
    Pure typographic mark. Inter Display 700, kerning -2%, with a custom
    accent dot under the "y" descender that mirrors our brand orange (set
    via fill="currentColor" so it inherits from the surrounding text color).
  -->
  <text
    x="0"
    y="44"
    font-family="'Inter Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.3"
    fill="currentColor"
  >Blyss</text>
  <!-- Accent dot under the "y" — a tiny mark of intent -->
  <circle cx="92" cy="56" r="2.5" fill="#C2410C"/>
</svg>
