<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0F0E0C"/>

  <!-- Subtle grid texture -->
  <g opacity="0.04" stroke="#F5F2EC" stroke-width="0.5">
    <line x1="0"   y1="105" x2="1200" y2="105"/>
    <line x1="0"   y1="210" x2="1200" y2="210"/>
    <line x1="0"   y1="420" x2="1200" y2="420"/>
    <line x1="0"   y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0"   x2="200"  y2="630"/>
    <line x1="400" y1="0"   x2="400"  y2="630"/>
    <line x1="800" y1="0"   x2="800"  y2="630"/>
    <line x1="1000" y1="0"  x2="1000" y2="630"/>
  </g>

  <!-- Wordmark Blyss + signature dot -->
  <text
    x="80"
    y="345"
    font-family="'Inter Display', 'Inter', system-ui, sans-serif"
    font-size="180"
    font-weight="800"
    letter-spacing="-7"
    fill="#F5F2EC"
  >Blyss</text>
  <circle cx="380" cy="380" r="14" fill="#F97316"/>

  <!-- Tagline -->
  <text
    x="80"
    y="430"
    font-family="'Inter', system-ui, sans-serif"
    font-size="32"
    font-weight="500"
    letter-spacing="-0.6"
    fill="#BAB5A8"
  >The modern marketplace for Kenyan creators.</text>

  <!-- Footer mark -->
  <text
    x="80"
    y="560"
    font-family="'Inter', system-ui, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#7A766B"
    letter-spacing="0.5"
  >blyss.co.ke</text>

  <!-- Right-side accent block -->
  <rect x="900" y="80" width="220" height="470" rx="6" fill="#F97316" opacity="0.95"/>
  <text
    x="1010"
    y="320"
    text-anchor="middle"
    font-family="'Inter Display', 'Inter', system-ui, sans-serif"
    font-size="180"
    font-weight="800"
    fill="#0F0E0C"
  >B</text>
</svg>
