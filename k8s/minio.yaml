apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: blyss
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: blyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: blyss-secrets
                  key: POLAR_MINIO_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blyss-secrets
                  key: POLAR_MINIO_PWD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: blyss
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
# One-shot bucket initialization. Creates the private + public buckets and
# sets the public-download policy. Without this, presigned upload URLs point
# at buckets that don't exist → browser "network error" on file upload.
# Idempotent: re-running on every deploy is safe (mb --ignore-existing).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: blyss
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - secretRef:
                name: blyss-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set loc http://minio:9000 "$POLAR_MINIO_USER" "$POLAR_MINIO_PWD" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 3
              done
              PUB="${POLAR_S3_FILES_PUBLIC_BUCKET_NAME:-blyss-public}"
              PRIV="${POLAR_S3_FILES_BUCKET_NAME:-blyss-private}"
              mc mb --ignore-existing "loc/$PUB"
              mc mb --ignore-existing "loc/$PRIV"
              mc anonymous set download "loc/$PUB"
              echo "minio-init done: $PUB (public), $PRIV (private)"
              mc ls loc/

