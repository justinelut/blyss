apiVersion: apps/v1
kind: Deployment
metadata:
  name: blyss-api
  namespace: blyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blyss-api
  template:
    metadata:
      labels:
        app: blyss-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: ghcr.io/justinelut/blyss-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10000
          envFrom:
            - secretRef:
                name: blyss-secrets
          volumeMounts:
            - name: jwks
              mountPath: /etc/blyss/jwks
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: jwks
          secret:
            secretName: blyss-jwks
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: blyss-api
  namespace: blyss
spec:
  selector:
    app: blyss-api
  ports:
    - port: 80
      targetPort: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blyss-worker
  namespace: blyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blyss-worker
  template:
    metadata:
      labels:
        app: blyss-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/justinelut/blyss-api:latest
          imagePullPolicy: IfNotPresent
          # The worker pod runs the dramatiq broker against ALL queue
          # tiers. The scheduler fork (`-f polar.worker.scheduler:start`)
          # was tried and reverted — it crash-looped in production while
          # working fine locally + in the dev container; the failure mode
          # was opaque (worker shows 'ready for action' then exits with
          # no traceback). Until we have a clean repro, scheduled cron
          # jobs run separately. Three things MUST be present here or
          # queued work silently stops:
          #   --queues default high_priority medium_priority low_priority
          #            webhooks  → without this dramatiq listens to
          #            'default' only and every TaskPriority.LOW actor
          #            (Loops backfill, marketing emails) sits forever.
          #   --  →  argparse option terminator so --queues' nargs='*'
          #            stops swallowing words and the broker positional
          #            ('polar.worker.run') is parsed as the broker.
          command:
            - "uv"
            - "run"
            - "dramatiq"
            - "-p"
            - "1"
            - "-t"
            - "1"
            - "--queues"
            - "default"
            - "high_priority"
            - "medium_priority"
            - "low_priority"
            - "webhooks"
            - "--"
            - "polar.worker.run"
          envFrom:
            - secretRef:
                name: blyss-secrets
          volumeMounts:
            - name: jwks
              mountPath: /etc/blyss/jwks
              readOnly: true
          resources:
            requests:
              # Bumped 384Mi → 512Mi to account for the APScheduler fork
              # process running alongside the dramatiq worker (-f
              # polar.worker.scheduler:start above). One pod, two Python
              # processes — the original 384Mi was tight even for the
              # worker alone.
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
      volumes:
        - name: jwks
          secret:
            secretName: blyss-jwks
            optional: true
