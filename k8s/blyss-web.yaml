apiVersion: apps/v1
kind: Deployment
metadata:
  name: blyss-web
  namespace: blyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blyss-web
  template:
    metadata:
      labels:
        app: blyss-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/justinelut/blyss-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.blyss.co.ke"
            - name: NEXT_PUBLIC_FRONTEND_BASE_URL
              value: "https://blyss.co.ke"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blyss-web
  namespace: blyss
spec:
  selector:
    app: blyss-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blyss-ingress
  namespace: blyss
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: www.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: buy.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: my.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: cdn.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
---
# Force X-Forwarded-Proto: https for the API host. The public edge terminates
# TLS, but the scheme reaching the pod can be http (cluster-internal), which
# makes Polar build http:// OAuth redirect_uris and Google rejects them
# (redirect_uri_mismatch). uvicorn runs with --proxy-headers so it honors this.
# This is an infra-layer fix — Polar application code is untouched.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-forwarded-https
  namespace: blyss
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blyss-api-ingress
  namespace: blyss
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: blyss-api-forwarded-https@kubernetescrd
spec:
  rules:
    - host: api.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-api
                port:
                  number: 80
