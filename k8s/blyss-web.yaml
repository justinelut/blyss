apiVersion: apps/v1
kind: Deployment
metadata:
  name: blyss-web
  namespace: blyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blyss-web
  template:
    metadata:
      labels:
        app: blyss-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/justinelut/blyss-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.blyss.co.ke"
            - name: NEXT_PUBLIC_FRONTEND_BASE_URL
              value: "https://blyss.co.ke"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blyss-web
  namespace: blyss
spec:
  selector:
    app: blyss-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blyss-ingress
  namespace: blyss
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: www.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: buy.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: my.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-web
                port:
                  number: 80
    - host: api.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blyss-api
                port:
                  number: 80
    - host: cdn.blyss.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
